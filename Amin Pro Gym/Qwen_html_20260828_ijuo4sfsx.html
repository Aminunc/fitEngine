<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FitEngine</title>
<style>
:root{--bg:#0b0e11;--card:#12161b;--card2:#1a2028;--tx:#f2f5f7;--mut:#8b95a1;--line:rgba(255,255,255,.09);--acc:#d7ff3f;--acc-tx:#141800}
[data-theme="light"]{--bg:#fafaf9;--card:#ffffff;--card2:#f0f0ee;--tx:#14181d;--mut:#6b7280;--line:rgba(0,0,0,.09);--acc:#4d7c0f;--acc-tx:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 120px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 4px}
.wordmark{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.ac{color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:20px 0 2px}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.rowline{display:flex;gap:14px;align-items:center;cursor:pointer}
.idx{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mut)}
.exname{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 18px;font:inherit;font-size:14px;font-weight:600;background:var(--tx);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.stepper{display:flex;align-items:center;gap:18px}
.stepper b{font-size:22px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.note{border-left:2px solid var(--acc);background:var(--card);border-radius:8px;padding:10px 14px;color:var(--mut);font-size:13px;margin:12px 0}
.sethead,.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px 34px;gap:8px;align-items:center}
.sethead{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:10px}
.setrow{margin-top:6px}
.setrow input{width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 4px;color:var(--tx);font:inherit;font-size:14px;text-align:center}
.setrow input:focus{outline:none;border-color:var(--mut)}
.chk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.chk.done{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 12px;font:inherit;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--acc)}
#restBar{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 40px));display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;z-index:9}
#restBar b{font-size:18px;font-variant-numeric:tabular-nums;min-width:44px}
#restBar .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#restBar .bar i{display:block;height:100%;background:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.demoWrap{display:flex;gap:6px;align-items:center;justify-content:center;margin:14px 0}
.demoWrap svg{border-radius:12px;background:var(--card2);color:var(--acc)}
.arrow{color:var(--mut)}
.cues{list-style:none;margin:12px 0;padding:0}
.cues li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:12px}
.cues li span{color:var(--mut);font-size:12px;font-weight:700}
select{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px}
.hide{display:none}
</style>
</head>
<body>

<button data-v="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2" fill="var(--bg)"/><circle cx="15" cy="12" r="2.2" fill="var(--bg)"/><circle cx="8" cy="17" r="2.2" fill="var(--bg)"/></svg>Settings</button>
</div></nav>

<script>

/* poses */
const PZ={stand:{h:[97,36],n:[99,52],s:[99,60],e:[99,84],w:[99,108],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},squat:{h:[111,72],n:[109,86],s:[105,92],e:[117,104],w:[125,92],p:[85,130],k:[111,146],a:[99,178],t:[111,180]},hinge:{h:[123,84],n:[118,96],s:[113,102],e:[115,126],w:[117,150],p:[83,118],k:[93,144],a:[99,178],t:[111,180]},lunge:{h:[99,62],n:[101,78],s:[101,86],e:[101,110],w:[101,134],p:[99,136],k:[123,148],a:[121,178],t:[133,180],k2:[79,158],a2:[69,176],t2:[59,178]},puT:{h:[152,92],n:[141,98],s:[134,102],e:[134,140],w:[134,178],p:[100,118],k:[70,134],a:[42,166],t:[32,176]},puB:{h:[150,128],n:[140,136],s:[133,142],e:[151,158],w:[134,178],p:[99,152],k:[70,162],a:[42,172],t:[32,178]},bnT:{h:[52,138],n:[64,142],s:[72,146],e:[74,120],w:[76,98],p:[112,148],k:[136,158],a:[138,178],t:[150,180]},bnB:{h:[52,138],n:[64,142],s:[72,146],e:[76,140],w:[80,126],p:[112,148],k:[136,158],a:[138,178],t:[150,180]},ohpA:{h:[97,36],n:[99,52],s:[99,60],e:[99,84],w:[105,62],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},ohpB:{h:[97,38],n:[99,54],s:[99,62],e:[103,38],w:[107,14],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},rowB:{h:[123,84],n:[118,96],s:[113,102],e:[95,112],w:[113,104],p:[83,118],k:[93,144],a:[99,178],t:[111,180]},plA:{h:[97,58],n:[99,72],s:[99,78],e:[99,50],w:[99,20],p:[97,118],k:[103,150],a:[95,176],t:[107,178]},plB:{h:[97,26],n:[99,40],s:[99,46],e:[97,70],w:[99,20],p:[97,88],k:[105,120],a:[97,148],t:[109,150]},curlB:{h:[97,36],n:[99,52],s:[99,60],e:[99,84],w:[107,66],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},latB:{h:[97,36],n:[99,52],s:[99,60],e:[119,66],w:[139,60],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},crA:{h:[40,166],n:[52,170],s:[62,172],e:[76,164],w:[92,158],p:[102,174],k:[132,150],a:[152,176],t:[164,178]},crB:{h:[54,128],n:[64,138],s:[74,148],e:[88,146],w:[102,142],p:[102,174],k:[132,150],a:[152,176],t:[164,178]},plank:{h:[150,108],n:[140,114],s:[133,118],e:[133,176],w:[153,178],p:[100,126],k:[70,140],a:[42,168],t:[32,178]},swA:{h:[123,84],n:[118,96],s:[113,102],e:[113,132],w:[115,158],p:[83,118],k:[93,144],a:[99,178],t:[111,180]},swB:{h:[97,36],n:[99,52],s:[99,60],e:[119,84],w:[139,84],p:[97,110],k:[99,144],a:[99,178],t:[111,180]},brA:{h:[46,162],n:[58,166],s:[68,170],e:[80,176],w:[92,178],p:[104,172],k:[134,150],a:[152,176],t:[164,178]},brB:{h:[46,162],n:[58,166],s:[68,168],e:[80,176],w:[92,178],p:[104,140],k:[134,142],a:[152,176],t:[164,178]},krB:{h:[97,58],n:[99,72],s:[99,78],e:[99,50],w:[99,20],p:[97,118],k:[127,120],a:[121,146],t:[133,148]},carry:{h:[97,36],n:[99,52],s:[99,60],e:[99,88],w:[99,120],p:[97,110],k:[99,144],a:[99,178],t:[111,180]}};
/* exercise db */
const EX=[{id:'squatBW',n:'Air Squat',mus:'quads',comp:1,need:[],demo:{a:'stand',b:'squat'},c:['Sit back and down, chest up','Knees track over toes','Controlled depth you own']},
{id:'gobletDB',n:'Goblet Squat',mus:'quads',comp:1,need:['db'],demo:{a:'stand',b:'squat',eq:'db'},c:['Hold DB at chest, elbows down','Brace, breathe into belly','Drive up through mid-foot']},
{id:'backSquat',n:'Back Squat',mus:'quads',comp:1,need:['bb'],demo:{a:'stand',b:'squat',eq:'bb',ori:'h'},c:['Bar on traps, big brace','Down 2s, knees out','Stand tall, glutes finish']},
{id:'bandSquat',n:'Band Squat',mus:'quads',comp:1,need:['band'],demo:{a:'stand',b:'squat',eq:'band'},c:['Band under feet, hands at shoulders','Control the descent','Explode against band']},
{id:'boxSquat',n:'Box Squat',mus:'quads',comp:1,need:['bench'],safe:['knees'],demo:{a:'stand',b:'squat',bench:2},c:['Sit back to box, stay tight','Touch, don\u2019t collapse','Stand without hands']},
{id:'bulgarian',n:'Bulgarian Split Squat',mus:'quads',comp:1,need:['bench'],avoid:['knees'],demo:{a:'stand',b:'lunge',bench:2,eq:'db'},c:['Rear foot on bench','Shin vertical, torso tall','Down 2s, drive up']},
{id:'lungeDB',n:'Walking Lunge',mus:'quads',comp:1,need:['db'],avoid:['knees'],demo:{a:'stand',b:'lunge',eq:'db'},c:['Long stride, back knee low','Torso upright','Push through front heel']},
{id:'stepUp',n:'Step-Up',mus:'quads',comp:1,need:['bench'],avoid:['knees'],demo:{a:'stand',b:'lunge',bench:2},c:['Whole foot on bench','Drive up, no toe push','Lower 2\u20133s']},
{id:'rdlDB',n:'Romanian Deadlift',mus:'hams',comp:1,need:['db'],avoid:['back'],demo:{a:'stand',b:'hinge',eq:'db'},c:['Soft knees, hips back','DBs slide along legs','Stop when hips stop']},
{id:'rdlBB',n:'RDL (Barbell)',mus:'hams',comp:1,need:['bb'],avoid:['back'],demo:{a:'stand',b:'hinge',eq:'bb',ori:'h'},c:['Bar close, lats tight','Hinge to mid-shin','Squeeze glutes to stand']},
{id:'swingKB',n:'KB Swing',mus:'hams',comp:1,need:['kb'],avoid:['back'],demo:{a:'swA',b:'swB',eq:'kb'},c:['Hike back, snap hips','Arms relaxed, float top','Plank tall, exhale']},
{id:'bridge',n:'Glute Bridge',mus:'glutes',comp:0,need:[],safe:['knees','back'],demo:{a:'brA',b:'brB'},c:['Ribs down, no arch','Hard glute squeeze 1s','Lower slow']},
{id:'hipThrust',n:'Hip Thrust',mus:'glutes',comp:1,need:['bb','bench'],safe:['knees'],demo:{a:'brA',b:'brB',eq:'bb',ori:'h'},c:['Shoulders on bench, chin tucked','Hips to table-top','Squeeze at top']},
{id:'pushup',n:'Push-Up',mus:'chest',comp:1,need:[],avoid:['wrists'],demo:{a:'puT',b:'puB'},c:['One straight line','Elbows ~45\u00b0','Chest to floor']},
{id:'dbFloor',n:'DB Floor Press',mus:'chest',comp:1,need:['db'],safe:['wrists','shoulders'],demo:{a:'bnT',b:'bnB',eq:'db'},c:['Neutral grip, elbows 45\u00b0','Upper arm touches floor','Press to lockout']},
{id:'dbBench',n:'DB Bench Press',mus:'chest',comp:1,need:['db','bench'],demo:{a:'bnT',b:'bnB',eq:'db'},c:['Blades pinched','Deep stretch below','Press up and together']},
{id:'bbBench',n:'Bench Press',mus:'chest',comp:1,need:['bb','bench'],demo:{a:'bnT',b:'bnB',eq:'bb',ori:'h'},c:['Feet planted, slight arch','Bar to lower chest','Press in straight line']},
{id:'ohpDB',n:'Overhead Press',mus:'shoulders',comp:1,need:['db'],avoid:['shoulders'],demo:{a:'ohpA',b:'ohpB',eq:'db'},c:['Ribs down, glutes tight','Head through at top','Lower 2s']},
{id:'ohpBB',n:'Overhead Press (BB)',mus:'shoulders',comp:1,need:['bb'],avoid:['shoulders'],demo:{a:'ohpA',b:'ohpB',eq:'bb',ori:'h'},c:['Forearms vertical','No lean back','Bar close to face']},
{id:'bandPress',n:'Band Overhead Press',mus:'shoulders',comp:1,need:['band'],avoid:['shoulders'],demo:{a:'ohpA',b:'ohpB',eq:'band'},c:['Brace tall','Press without flare','Control return']},
{id:'latDB',n:'Lateral Raise',mus:'shoulders',comp:0,need:['db'],safe:['shoulders'],demo:{a:'stand',b:'latB',eq:'db'},c:['Soft elbows','To shoulder height','Lower 2\u20133s, no swing']},
{id:'latBand',n:'Lateral Raise (Band)',mus:'shoulders',comp:0,need:['band'],safe:['shoulders'],demo:{a:'stand',b:'latB',eq:'band'},c:['Band under feet','Smooth arc','Control down']},
{id:'dbRow',n:'One-Arm DB Row',mus:'back',comp:1,need:['db'],demo:{a:'hinge',b:'rowB',eq:'db'},c:['Flat back, supported','Pull to hip','Stretch at bottom']},
{id:'bbRow',n:'Barbell Row',mus:'back',comp:1,need:['bb'],avoid:['back'],demo:{a:'hinge',b:'rowB',eq:'bb',ori:'h'},c:['Hinge 45\u00b0, bar close','Pull to ribs','No bounce']},
{id:'bandRow',n:'Band Row',mus:'back',comp:1,need:['band'],safe:['back'],demo:{a:'hinge',b:'rowB',eq:'band'},c:['Anchor at chest','Squeeze blades 1s','Slow return']},
{id:'pullup',n:'Pull-Up',mus:'back',comp:1,need:['bar'],demo:{a:'plA',b:'plB',bar:1},c:['Dead hang start','Chest to bar','Lower 2s']},
{id:'chinup',n:'Chin-Up',mus:'back',comp:1,need:['bar'],demo:{a:'plA',b:'plB',bar:1},c:['Underhand grip','Lead with chest','Full lockout below']},
{id:'bandPD',n:'Band Pulldown',mus:'back',comp:1,need:['band'],demo:{a:'plA',b:'plB',bar:1,eq:'band'},c:['Anchor high','Elbows to ribs','Control up']},
{id:'curlDB',n:'DB Curl',mus:'biceps',comp:0,need:['db'],demo:{a:'stand',b:'curlB',eq:'db'},c:['Elbows pinned','No swing','Lower 2\u20133s']},
{id:'curlBand',n:'Band Curl',mus:'biceps',comp:0,need:['band'],demo:{a:'stand',b:'curlB',eq:'band'},c:['Band under feet','Full squeeze','Slow negative']},
{id:'skullDB',n:'Skull Crusher',mus:'triceps',comp:0,need:['db','bench'],demo:{a:'bnT',b:'bnB',eq:'db'},c:['Upper arms vertical','Lower beside head','Extend, squeeze']},
{id:'crunch',n:'Crunch',mus:'core',comp:0,need:[],demo:{a:'crA',b:'crB'},c:['Low back down','Exhale, ribs to hips','No neck pull']},
{id:'plank',n:'Plank',mus:'core',comp:0,need:[],demo:{a:'plank',b:'plank'},c:['Elbows under shoulders','Glutes + abs tight','One line, breathe']},
{id:'hkr',n:'Hanging Knee Raise',mus:'core',comp:0,need:['bar'],demo:{a:'plA',b:'krB',bar:1},c:['No swing','Curl pelvis','Lower 2s']},
{id:'farmer',n:'Farmer Carry',mus:'core',comp:1,need:['db'],demo:{a:'carry',b:'carry',eq:'db'},c:['Tall, shoulders back','Short quick steps','Brace']},
{id:'wInch',n:'Inchworm',mus:'warm',demo:null,c:['Walk hands out to plank','Hold 1s','Walk back \u00d75']},
{id:'wCat',n:'Cat-Camel',mus:'warm',demo:null,c:['Round, then arch','Slow','5 cycles']},
{id:'w9090',n:'90/90 Hip Switch',mus:'warm',demo:null,c:['Sit 90/90','Rotate floor to floor','5/side']},
{id:'wArm',n:'Arm Circles',mus:'warm',demo:null,c:['10 forward','10 back','Grow bigger']},
{id:'wBird',n:'Bird-Dog',mus:'warm',demo:null,c:['Opposite reach','No rotation','5/side']},
{id:'wScap',n:'Scap Push-Up',mus:'warm',demo:null,c:['Arms straight','Sink then push','10 reps']}];
const EXM=Object.fromEntries(EX.map(e=>[e.id,e]));
const EQ_LABEL={band:'Bands',db:'Dumbbells',kb:'Kettlebell',bar:'Pull-up bar',bench:'Bench',bb:'Barbell + rack'};
const JOINTS=['knees','back','shoulders','wrists','elbows'];
const GOALS={muscle:{rep:'8\u201312',rest:120,rpe:'RPE 8',top:12,label:'Hypertrophy'},strength:{rep:'4\u20136',rest:180,rpe:'RPE 8\u20139',top:6,label:'Strength'},fatloss:{rep:'10\u201315',rest:60,rpe:'RPE 7\u20138',top:15,label:'Fat loss'},health:{rep:'10\u201315',rest:90,rpe:'RPE 7',top:15,label:'General fitness'}};
/* engine */
const owned=e=>e.need.every(n=>S.equip.includes(n));
const allowed=e=>owned(e)&&!e.avoid.some(j=>S.joints.includes(j));
function pick(mus,used){const c=EX.filter(e=>e.mus===mus&&allowed(e));if(!c.length)return null;c.sort((a,b)=>(b.comp-a.comp)+(((b.safe||[]).filter(j=>S.joints.includes(j)).length)-((a.safe||[]).filter(j=>S.joints.includes(j)).length))*3-(used[a.id]?1:0)+(used[b.id]?1:0));return c[0]}
function sessions(){const g=GOALS[S.goal];let sets=S.exp==='beg'?3:S.exp==='int'?4:5;if(S.time<=20)sets=Math.max(2,sets-1);
const mk=(title,slots)=>{const used={},items=[];slots.forEach(sl=>{if(sl.min&&S.time<sl.min)return;const e=pick(sl.m,used);if(e){used[e.id]=1;items.push({id:e.id,sets,reps:g.rep,rest:g.rest,pair:false})}});
if(S.time<=20||S.goal==='fatloss')for(let i=0;i+1<items.length;i+=2){items[i].pair=true;items[i+1].pair=true}
const warm=['wInch'];if(items.some(i=>['quads','hams','glutes'].includes(EXM[i.id].mus)))warm.push('w9090');if(items.some(i=>['chest','shoulders','back'].includes(EXM[i.id].mus)))warm.push('wArm','wScap');if(items.some(i=>EXM[i.id].mus==='hams'))warm.push('wCat');return{title,items,warm}};
let t;if(S.days<=3)t=[0,1,2].map(()=>mk('Full Body',[{m:'quads'},{m:'hams'},{m:'chest'},{m:'back'},{m:'shoulders',min:30},{m:'core',min:30},{m:'biceps',min:45},{m:'triceps',min:45}]));
else if(S.days===4)t=[mk('Upper',[{m:'chest'},{m:'back'},{m:'shoulders'},{m:'biceps',min:30},{m:'triceps',min:30},{m:'core',min:45}]),mk('Lower',[{m:'quads'},{m:'hams'},{m:'glutes'},{m:'core'}]),mk('Upper',[{m:'chest'},{m:'back'},{m:'shoulders'},{m:'biceps',min:30},{m:'triceps',min:30},{m:'core',min:45}]),mk('Lower',[{m:'quads'},{m:'hams'},{m:'glutes'},{m:'core'}])];
else t=[mk('Push',[{m:'chest'},{m:'shoulders'},{m:'chest'},{m:'triceps'},{m:'shoulders',min:45}]),mk('Pull',[{m:'back'},{m:'back'},{m:'biceps'},{m:'core'},{m:'back',min:45}]),mk('Legs',[{m:'quads'},{m:'hams'},{m:'glutes'},{m:'core'},{m:'quads',min:45}])];
while(t.length<S.days)t=t.concat(t);return t.slice(0,S.days)}
const splitName=()=>S.days<=3?'Full-body split':S.days===4?'Upper / Lower':'Push \u00b7 Pull \u00b7 Legs';
function suggest(id,reps){const h=hist().filter(x=>x.items.some(i=>i.id===id));if(!h.length)return null;const it=h[h.length-1].items.find(i=>i.id===id);if(!it||!it.sets.length)return null;const top=parseInt(reps.split('\u2013').pop());const low=['quads','hams','glutes'].includes(EXM[id].mus);const st=S.units==='kg'?(low?2:1):(low?5:2.5);return it.sets.every(s=>s.r>=top)?'All reps hit last time \u2014 add '+st+' '+S.units:''}
/* demo renderer */
function figIn(p,o){o=o||{};const L=(a,b,w,op)=>'<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="currentColor" stroke-width="'+(w||5)+'" stroke-linecap="round"'+(op?' opacity="'+op+'"':'')+'/>';
let s='<line x1="10" y1="184" x2="190" y2="184" stroke="currentColor" stroke-width="2" opacity=".2"/>';
if(o.bar)s+='<line x1="30" y1="16" x2="170" y2="16" stroke="currentColor" stroke-width="4" opacity=".4"/>';
if(o.bench===1)s+='<rect x="40" y="150" width="115" height="10" rx="3" fill="currentColor" opacity=".3"/>';
if(o.bench===2)s+='<rect x="46" y="150" width="44" height="32" rx="3" fill="currentColor" opacity=".3"/>';
s+=L(p.n,p.s)+L(p.s,p.p)+L(p.s,p.e)+L(p.e,p.w)+L(p.p,p.k)+L(p.a,p.t);
if(p.k2)s+=L(p.p,p.k2)+L(p.k2,p.a2)+L(p.a2,p.t2);
s+='<circle cx="'+p.h[0]+'" cy="'+p.h[1]+'" r="11" fill="currentColor"/>';
const w=p.w,M='stroke="var(--mut)"';
if(o.eq==='db')s+='<line x1="'+(w[0]-7)+'" y1="'+w[1]+'" x2="'+(w[0]+7)+'" y2="'+w[1]+'" '+M+' stroke-width="2"/><circle cx="'+(w[0]-7)+'" cy="'+w[1]+'" r="5" fill="var(--bg)" '+M+' stroke-width="2"/><circle cx="'+(w[0]+7)+'" cy="'+w[1]+'" r="5" fill="var(--bg)" '+M+' stroke-width="2"/>';
if(o.eq==='kb')s+='<circle cx="'+w[0]+'" cy="'+(w[1]+9)+'" r="8" fill="var(--bg)" '+M+' stroke-width="2"/>';
if(o.eq==='bb'){if(o.ori==='h')s+='<line x1="'+(w[0]-55)+'" y1="'+w[1]+'" x2="'+(w[0]+55)+'" y2="'+w[1]+'" '+M+' stroke-width="3"/><circle cx="'+(w[0]-48)+'" cy="'+w[1]+'" r="9" fill="var(--bg)" '+M+' stroke-width="2"/><circle cx="'+(w[0]+48)+'" cy="'+w[1]+'" r="9" fill="var(--bg)" '+M+' stroke-width="2"/>';else s+='<line x1="'+w[0]+'" y1="'+(w[1]-40)+'" x2="'+w[0]+'" y2="'+(w[1]+40)+'" '+M+' stroke-width="3"/><circle cx="'+w[0]+'" cy="'+(w[1]-34)+'" r="8" fill="var(--bg)" '+M+' stroke-width="2"/><circle cx="'+w[0]+'" cy="'+(w[1]+34)+'" r="8" fill="var(--bg)" '+M+' stroke-width="2"/>'}
if(o.eq==='band')s+='<path d="M'+w[0]+' '+w[1]+' Q '+(w[0]-22)+' '+((w[1]+p.a[1])/2)+' '+p.a[0]+' '+p.a[1]+'" fill="none" '+M+' stroke-width="3"/>';
return s}
const lerp=(a,b,t)=>{const o={};for(const k in a)o[k]=[a[k][0]+(b[k][0]-a[k][0])*t,a[k][1]+(b[k][1]-a[k][1])*t];return o};
/* ui state */
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
let view='home',work=null,restEnd=0,restTot=0,animRaf=null;
const stopAnim=()=>{if(animRaf)cancelAnimationFrame(animRaf);animRaf=null};
const modal=h=>{modalRoot.innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">'+h+'</div></div>'};
window.closeModal=()=>{modalRoot.innerHTML='';stopAnim()};
function beep(){if(!soundOn)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.18);o.stop(c.currentTime+i*.18+.15)})}catch(e){}}
window.showDemo=id=>{const e=EXM[id];if(!e)return;
if(!e.demo){modal('<h3>'+e.n+'</h3><ul class="cues">'+e.c.map((x,i)=>'<li><span>0'+(i+1)+'</span>'+x+'</li>').join('')+'</ul><button class="btn block" onclick="closeModal()">Done</button>');return}
const o=e.demo;
modal('<h3>'+e.n+'</h3><div class="sub">Start \u2192 finish \u00b7 2s down, 1s up</div><div class="demoWrap"><svg viewBox="0 0 200 200" width="140" height="140">'+figIn(PZ[o.a],o)+'</svg><span class="arrow">'+I('chev',22)+'</span><svg viewBox="0 0 200 200" width="140" height="140">'+figIn(PZ[o.b],o)+'</svg></div><div class="demoWrap hide" id="animD"><svg id="animSvg" viewBox="0 0 200 200" width="230" height="230"></svg></div><button class="btn ghost block" id="animBtn">'+I('play')+' Play movement</button><ul class="cues">'+e.c.map((x,i)=>'<li><span>0'+(i+1)+'</span>'+x+'</li>').join('')+'</ul><button class="btn block" onclick="closeModal()">Done</button>');
let playing=false;
document.getElementById('animBtn').onclick=function(){playing=!playing;this.innerHTML=playing?I('x')+' Static view':I('play')+' Play movement';document.querySelector('.demoWrap').classList.toggle('hide',playing);document.getElementById('animD').classList.toggle('hide',!playing);stopAnim();
if(playing){const t0=performance.now();const loop=n=>{const el=(n-t0)/1000,cy=el%2.4;let t=cy<1?cy:cy<1.4?1:2.4-cy;t=t*t*(3-2*t);document.getElementById('animSvg').innerHTML=figIn(lerp(PZ[o.a],PZ[o.b],t),o);animRaf=requestAnimationFrame(loop)};animRaf=requestAnimationFrame(loop)}}};
/* rest timer */
window.startRest=s=>{restEnd=Date.now()+s*1000;restTot=s;tick()};
window.skipRest=()=>{restEnd=0;tick()};
function tick(){let b=document.getElementById('restBar');
if(restEnd>Date.now()){if(!b){b=document.createElement('div');b.id='restBar';document.body.appendChild(b)}
b.innerHTML='<b>0:'+String(Math.ceil((restEnd-Date.now())/1000)).padStart(2,'0')+'</b><span class="bar"><i style="width:'+Math.round(100*(restEnd-Date.now())/(restTot*1000))+'%"></i></span><button class="iconbtn" onclick="skipRest()">'+I('x',16)+'</button>';setTimeout(tick,250)}
else if(b){b.remove();if(restEnd){beep();if(navigator.vibrate)navigator.vibrate(200)}restEnd=0}}
/* views */
function nav(v){view=v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
const estMin=s=>Math.round(5+s.items.reduce((a,i)=>a+i.sets*(1+i.rest/60),0));
function render(){if(view==='home')rHome();else if(view==='workout')rWork();else if(view==='progress')rProg();else rSet()}
function rHome(){const Ss=sessions(),today=new Date().getDay()%Ss.length,T=Ss[today];
const weeks=[...new Set(hist().map(h=>h.d.slice(0,7)))].length;
app.innerHTML='<div class="top"><div class="wordmark">Fit<span class="ac">/</span>Engine</div><div class="sub">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})+'</div></div>'+
'<h2 class="title">'+T.title+'</h2><div class="sub">'+splitName()+' \u00b7 '+S.days+'\u00d7/week \u00b7 '+S.time+' min \u00b7 '+GOALS[S.goal].label+'</div>'+
(weeks>0&&weeks%5===0?'<div class="note">Deload week \u2014 halve sets, keep quality.</div>':'')+
(!hist().length&&!S.equip.length?'<div class="note">Bodyweight mode. Add your equipment in Settings to unlock dumbbell / barbell / band work.</div>':'')+
'<button class="btn block" style="margin-top:18px" onclick="openSession('+today+')">'+I('play')+' Start workout</button>'+
'<div class="label">This week</div>'+
Ss.map((s,i)=>'<div class="card rowline" onclick="preview('+i+')"><span class="idx">0'+(i+1)+'</span><span style="flex:1"><span class="exname">'+s.title+'</span><br><span class="sub">'+s.items.length+' exercises \u00b7 ~'+estMin(s)+' min</span></span>'+I('chev')+'</div>').join('');
}
window.preview=i=>{const s=sessions()[i];modal('<h3>'+s.title+'</h3><div class="sub">~'+estMin(s)+' min \u00b7 '+GOALS[S.goal].rpe+'</div>'+s.items.map(it=>{const e=EXM[it.id];return '<div class="card" style="margin-top:10px"><div class="rowline"><span style="flex:1"><span class="exname">'+e.n+'</span><br><span class="sub">'+it.sets+' \u00d7 '+it.reps+' \u00b7 rest '+it.rest+'s</span></span><button class="iconbtn" onclick="showDemo(\''+e.id+'\')">'+I('play',16)+'</button></div></div>'}).join('')+'<button class="btn block" style="margin-top:8px" onclick="closeModal();openSession('+i+')">'+I('play')+' Start</button>')};
window.openSession=i=>{work=JSON.parse(JSON.stringify(sessions()[i]));work.items.forEach(it=>it.log=Array.from({length:it.sets},()=>({w:'',r:'',done:false})));view='home';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='home'));rWork()};
function rWork(){const s=work;
app.innerHTML='<div class="top"><button class="iconbtn" onclick="view=\'home\';render()">'+I('back')+'</button><div class="wordmark">'+s.title+'</div><span style="width:34px"></span></div>'+
'<div class="sub" style="margin-top:14px">WARM-UP</div><div class="card" style="margin-top:6px">'+s.warm.map(w=>EXM[w].n).join(' \u2192 ')+'</div>'+
'<div class="label">Working sets</div>'+
s.items.map((it,i)=>{const e=EXM[it.id],sg=suggest(it.id,it.reps);
return '<div class="card"><div class="rowline"><span style="flex:1"><span class="exname">'+e.n+'</span><br><span class="sub">'+it.sets+' \u00d7 '+it.reps+' \u00b7 '+GOALS[S.goal].rpe+' \u00b7 rest '+it.rest+'s'+(it.pair?' \u00b7 superset':'')+'</span></span><button class="iconbtn" onclick="swapEx('+i+')">'+I('swap',16)+'</button><button class="iconbtn" onclick="showDemo(\''+e.id+'\')">'+I('play',16)+'</button></div>'+
(sg?'<div class="note">'+sg+'</div>':'')+
'<div class="sethead"><span>Set</span><span>'+S.units+'</span><span>Reps</span><span></span><span></span></div>'+
it.log.map((l,si)=>'<div class="setrow"><span class="idx">'+(si+1)+'</span><input type="number" inputmode="decimal" value="'+l.w+'" onchange="setLog('+i+','+si+',\'w\',this.value)"><input type="number" inputmode="numeric" value="'+l.r+'" onchange="setLog('+i+','+si+',\'r\',this.value)"><button class="chk'+(l.done?' done':'')+'" onclick="setDone('+i+','+si+')">'+I('check',15)+'</button><button class="iconbtn" onclick="startRest('+it.rest+')">'+I('timer',16)+'</button></div>').join('')+
'<div style="margin-top:10px;display:flex;gap:8px"><button class="iconbtn" onclick="adjSets('+i+',-1)">'+I('minus',14)+'</button><button class="iconbtn" onclick="adjSets('+i+',1)">'+I('plus',14)+'</button><span class="sub" style="align-self:center">sets</span></div></div>'}).join('')+
'<button class="btn block" onclick="finish()">'+I('check')+' Finish & save</button>'}
window.adjSets=(i,d)=>{work.items[i].sets=Math.min(6,Math.max(1,work.items[i].sets+d));work.items[i].log=Array.from({length:work.items[i].sets},(_,si)=>work.items[i].log[si]||{w:'',r:'',done:false});rWork()};
window.setLog=(i,si,k,v)=>{work.items[i].log[si][k]=v};
window.setDone=(i,si)=>{work.items[i].log[si].done=!work.items[i].log[si].done;rWork();if(work.items[i].log[si].done)startRest(work.items[i].rest)};
window.swapEx=i=>{const cur=work.items[i];const al=EX.filter(e=>e.mus===EXM[cur.id].mus&&e.id!==cur.id&&allowed(e));modal('<h3>Swap '+EXM[cur.id].n+'</h3><div class="sub">Same target muscles, your equipment</div>'+al.map(a=>'<button class="btn ghost block" style="margin-top:8px;justify-content:flex-start" onclick="doSwap('+i+',\''+a.id+'\')">'+a.n+'</button>').join('')+'<button class="btn block" style="margin-top:8px" onclick="closeModal()">Cancel</button>')};
window.doSwap=(i,id)=>{work.items[i].id=id;closeModal();rWork()};
window.finish=()=>{const h=hist();h.push({d:new Date().toISOString(),items:work.items.map(it=>({id:it.id,sets:it.log.filter(l=>l.done||l.r).map(l=>({w:+l.w||0,r:+l.r||0}))}))});LS.set('fe_hist',h);work=null;view='home';render()};
/* progress */
function rProg(){const h=hist(),ids=[...new Set(h.flatMap(x=>x.items.map(i=>i.id)))];
app.innerHTML='<div class="top"><div class="wordmark">Fit<span class="ac">/</span>Engine</div></div><h2 class="title">Progress</h2>'+
(ids.length?'<select onchange="drawChart(this.value)">'+ids.map(i=>'<option value="'+i+'">'+EXM[i].n+'</option>').join('')+'</select><div id="chart" style="margin-top:14px"></div><div id="chart2"></div>':'<div class="card" style="margin-top:14px"><span class="sub">Finish workouts and log your sets \u2014 strength trends and weekly volume appear here, and the app starts prescribing weight increases automatically.</span></div>')};
window.drawChart=id=>{const h=hist().filter(x=>x.items.some(i=>i.id===id));
const pts=h.map(x=>{const it=x.items.find(i=>i.id===id);return{d:x.d.slice(5,10),w:Math.max(...it.sets.map(s=>s.w))}}).filter(p=>p.w>0);
const c1=document.getElementById('chart');
if(pts.length>1){const mx=Math.max(...pts.map(p=>p.w)),mn=Math.min(...pts.map(p=>p.w)),W=320,H=130;
const xy=pts.map((p,i)=>[12+i*(W-24)/(pts.length-1),H-16-((p.w-mn)/((mx-mn)||1))*(H-40)]);
c1.innerHTML='<div class="label" style="margin:0 0 6px">Top set \u00b7 '+S.units+'</div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="'+xy.map(p=>p.join(',')).join(' ')+'"/>'+xy.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="var(--acc)"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" font-size="9" fill="var(--mut)" text-anchor="middle">'+pts[i].w+'</text>').join('')+'</svg>'}
else c1.innerHTML='<div class="note">Log weights over two or more sessions to see your strength curve.</div>';
const wk={};hist().forEach(x=>{const k=x.d.slice(0,7);wk[k]=(wk[k]||0)+x.items.reduce((a,i)=>a+i.sets.length,0)});
const ks=Object.keys(wk).slice(-6),mx=Math.max(...ks.map(k=>wk[k]),1);
document.getElementById('chart2').innerHTML='<div class="label">Weekly sets</div><svg viewBox="0 0 320 110" style="width:100%">'+ks.map((k,i)=>'<rect x="'+(14+i*52)+'" y="'+(92-wk[k]/mx*72)+'" width="32" height="'+(wk[k]/mx*72)+'" rx="4" fill="var(--acc)" opacity="'+(i===ks.length-1?1:.35)+'"/><text x="'+(30+i*52)+'" y="106" font-size="9" fill="var(--mut)" text-anchor="middle">'+k.slice(5)+'</text>').join('')+'</svg>'};
/* settings — instant apply */
function rSet(){app.innerHTML='<div class="top"><div class="wordmark">Fit<span class="ac">/</span>Engine</div></div><h2 class="title">Settings</h2><div class="sub">Changes apply to your plan instantly.</div>'+
'<div class="label">Goal</div><div class="chips">'+Object.entries(GOALS).map(([k,v])=>'<button class="chip'+(S.goal===k?' on':'')+'" onclick="setK(\'goal\',\''+k+'\')">'+v.label+'</button>').join('')+'</div>'+
'<div class="label">Experience</div><div class="seg">'+[['beg','Beginner'],['int','Intermediate'],['adv','Advanced']].map(([k,v])=>'<button class="'+(S.exp===k?'on':'')+'" onclick="setK(\'exp\',\''+k+'\')">'+v+'</button>').join('')+'</div>'+
'<div class="label">Days per week</div><div class="stepper"><button class="iconbtn" onclick="adjDays(-1)">'+I('minus',16)+'</button><b>'+S.days+'</b><button class="iconbtn" onclick="adjDays(1)">'+I('plus',16)+'</button><span class="sub">'+splitName()+'</span></div>'+
'<div class="label">Session length</div><div class="seg">'+[20,30,45,60].map(t=>'<button class="'+(S.time===t?'on':'')+'" onclick="setK(\'time\','+t+')">'+t+'m</button>').join('')+'</div>'+
'<div class="label">Units</div><div class="seg"><button class="'+(S.units==='kg'?'on':'')+'" onclick="setK(\'units\',\'kg\')">kg</button><button class="'+(S.units==='lb'?'on':'')+'" onclick="setK(\'units\',\'lb\')">lb</button></div>'+
'<div class="label">Equipment you own</div><div class="chips">'+Object.entries(EQ_LABEL).map(([k,v])=>'<button class="chip'+(S.equip.includes(k)?' on':'')+'" onclick="togEq(\''+k+'\')">'+v+'</button>').join('')+'</div>'+
'<div class="label">Joints to protect</div><div class="chips">'+JOINTS.map(j=>'<button class="chip'+(S.joints.includes(j)?' on':'')+'" onclick="togJ(\''+j+'\')">'+j+'</button>').join('')+'</div>'+
'<div class="label">Appearance & cues</div><div class="chips"><button class="chip'+(dark==='dark'?' on':'')+'" onclick="setTheme(\'dark\')">Dark</button><button class="chip'+(dark==='light'?' on':'')+'" onclick="setTheme(\'light\')">Light</button><button class="chip'+(soundOn?' on':'')+'" onclick="togSound()">Sound '+(soundOn?'on':'off')+'</button></div>'+
'<div class="sub" style="margin:26px 0">FitEngine v2 \u00b7 installs as an app, works offline.</div>'}
window.setK=(k,v)=>{S[k]=v;saveS();render()};
window.adjDays=d=>{S.days=Math.min(6,Math.max(2,S.days+d));saveS();render()};
window.togEq=k=>{S.equip=S.equip.includes(k)?S.equip.filter(x=>x!==k):[...S.equip,k];saveS();render()};
window.togJ=k=>{S.joints=S.joints.includes(k)?S.joints.filter(x=>x!==k):[...S.joints,k];saveS();render()};
window.setTheme=t=>{dark=t;LS.set('fe_dark',t);document.documentElement.dataset.theme=t;render()};
window.togSound=()=>{soundOn=!soundOn;LS.set('fe_sound',soundOn);render()};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
